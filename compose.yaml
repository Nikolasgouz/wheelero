services:
  web:
    build:
      context: .
      args:
        PUBLIC_URL: https://${SITE_HOST:?Set SITE_HOST to your configured domain}
        PUBLIC_INDEXING: ${PUBLIC_INDEXING:-false}
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:?Set SITE_HOST to your configured domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
